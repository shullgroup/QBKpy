# ##########################################################
# TA Instruments / ElectroForce Data Standardization Mapping
# ##########################################################

[file]
test_method        = "dma"           # Matches [dma] section in standards.toml
encoding           = ""              # Autodetected if empty
delim              = ""              # Autodetected if empty
decimal_sep        = "."
name_use           = "standard_name" # Options: "standard_name", "short_name", "raw_name"

# 1. Component Sequence
structure_sequence = ["info", "header", "unit", "data"]

# 2. Component Details
unit_placement     = "separate_row" # Units on line 2 (e.g., "Sec", "mm", "N")
info_prefix        = "#"            # Preamble header lines start with '#'

# 3. Multi-Segment Hints (Optional for single-run files)
[file_hints.segments]
multi_segs         = false
seg_start          = ""
seg_end            = ""
segment_sequence   = ["info", "header", "unit", "data"]


# ##########################################################
# VARIABLES MAPPING TABLE
# ##########################################################

[[vars]]
raw_name      = "Points"
raw_unit      = ""
standard_name = "points"
short_name    = "points"
si_unit       = ""

[[vars]]
raw_name      = "Elapsed Time"
raw_unit      = "Sec"
standard_name = "time"
short_name    = "time"
si_unit       = "s"

[[vars]]
raw_name      = "Scan Time"
raw_unit      = "Sec"
standard_name = "scan_time"
short_name    = "scan_time"
si_unit       = "s"

[[vars]]
raw_name      = "Disp"
raw_unit      = "mm"
standard_name = "displacement"
short_name    = "disp"
si_unit       = "m"
convert_expr  = "x * 1e-3"

[[vars]]
raw_name      = "Load"
raw_unit      = "N"
standard_name = "load"
short_name    = "P"
si_unit       = "N"

[[vars]]
raw_name      = "Torque"
raw_unit      = "Nm"
standard_name = "torque"
short_name    = "torque"
si_unit       = "Nm"

[[vars]]
raw_name      = "Ch 4"
raw_unit      = "V"
standard_name = "channel_4_voltage"
short_name    = "ch4"
si_unit       = "V"

[[vars]]
raw_name      = "Rotation"
raw_unit      = "deg"
standard_name = "rotation_angle"
short_name    = "rot"
si_unit       = "rad"
convert_expr  = "x * (np.pi / 180.0)"

[[vars]]
raw_name      = "T1 Control"
