# ##########################################################
# Anton Paar Rheometer Data Standardization Mapping Registry
# ##########################################################
# This configuration maps raw rheology export column names to 
# standardized database properties, while ensuring all numeric
# values scale dynamically to absolute SI metric targets.

# numpy constants can be writen as np.[constant] e.g.: np.pi

# ##########################################################

### file structure hints for data detection ###
# this part is optional. it can be autodetected and defined in functions.

[file]
# if value is left as "", the code will try to find

# test method 
test_method         = "rheology"   # rheology, DMA, TGA, DSC, QCM etc (can be found in standards.toml)
encoding            = ""   
delim               = ""
decimal_sep         = "."                # Decimal separator ("." or ",")
name_use            = "standard_name" # keys in vars "standard_name", "short_name" "raw_name"

# 1. Component Sequence
# Defines the order in which blocks appear in the file or per segment
# Supported block types: "info", "header", "unit", "data"
structure_sequence   = ["info", "header", "unit", "data"]

# 2. Component Details
unit_placement       = "separate_row" # Options: "separate_row", "in_header" (e.g. "Time [s]")
info_prefix          = "#"            # Character prefix for info/comment lines if marked (optional)

# 3. Multi-Segment Hints
[file_hints.segments]
multi_segs          = true
seg_start           = "[step]"     # Trigger substring or regex for section boundary
seg_end             = ""           # End marker ("" means blank line)
# Sequence within each segment if different from global structure_sequence
segment_sequence    = ["info", "header", "unit", "data"]


### variables information ###
[[vars]]
raw_name = "Point No."
raw_unit = ""
standard_name = "point_number"
short_name = "number"
si_unit = ""

[[vars]]
raw_name = "Status"
raw_unit = ""
standard_name = "status"
short_name = "status"
si_unit = ""

[[vars]]
raw_name = "Time"
raw_unit = "[min]"
standard_name = "time"
short_name = "t"
si_unit = "s"
convert_expr = 'x * 60.0' # Scales minutes to seconds

[[vars]]
raw_name = "Temperature"
raw_unit = "[°C]"
standard_name = "temperature"
short_name = "temp"
si_unit = "K"
convert_expr = 'x + 273.15' # Applies linear absolute offset (Celsius to Kelvin)

# --- Kinematic & Frequency Parameters ---

[[vars]]
raw_name = "Frequency"
raw_unit = "[Hz]"
standard_name = "frequency"
short_name = "freq"
si_unit = "Hz"

[[vars]]
raw_name = "Angular Frequency"
raw_unit = "[rad/s]"
standard_name = "angular_frequency"
short_name = "omega"
si_unit = "rad/s"

[[vars]]
raw_name = "Phase Shift Angle"
raw_unit = "[°]"
standard_name = "phase_angle"
short_name = "phi"
si_unit = "rad"
convert_expr = 'x * (np.pi / 180.0)' # Vectorized degrees-to-radians scaling

# --- Strain & Stress Parameters ---

[[vars]]
raw_name = "Shear Stress"
raw_unit = "[Pa]"
standard_name = "shear_stress"
short_name = ""
si_unit = "Pa"

[[vars]]
raw_name = "Shear Strain"
raw_unit = "[1]"
standard_name = "shear_strain"
short_name = ""
si_unit = ""

[[vars]]
raw_name = "Shear Strain"
raw_unit = "[%]"
standard_name = "shear_strain"
short_name = ""
si_unit = ""
convert_expr = 'x * 0.01' # Normalizes percentage scaling to a true ratio

# --- Torque Scale Variants ---

[[vars]]
raw_name = "Torque"
raw_unit = "[mN·m]"
standard_name = "torque"
short_name = ""
si_unit = "Nm"
convert_expr = 'x * 1e-3' # Milli-Newton-meters conversion

[[vars]]
raw_name = "Torque"
raw_unit = "[µN·m]"
standard_name = "torque"
short_name = "M"
si_unit = "Nm"
convert_expr = 'x * 1e-6' # Micro-Newton-meters conversion

# --- Moduli & Viscosity Parameters ---

[[vars]]
raw_name = "Storage Modulus"
raw_unit = "[Pa]"
standard_name = "storage_modulus"
short_name = ""
si_unit = "Pa"

[[vars]]
raw_name = "Loss Modulus"
raw_unit = "[Pa]"
standard_name = "loss_modulus"
short_name = ""
si_unit = "Pa"

[[vars]]
raw_name = "Loss Factor"
raw_unit = "[1]"
standard_name = "loss_factor"
short_name = ""
si_unit = "1"

[[vars]]
raw_name = "Complex Shear Modulus"
raw_unit = "[Pa]"
standard_name = "complex_modulus"
short_name = ""
si_unit = "Pa"

[[vars]]
raw_name = "Complex Viscosity"
raw_unit = "[mPa·s]"
standard_name = "complex_viscosity"
short_name = ""
si_unit = "Pas"
convert_expr = 'x * 1e-3' # Milli-Pascal-seconds to Pascal-seconds